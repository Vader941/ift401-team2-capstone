name: Bug report
description: Report behavior that is incorrect or broken
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, credentials, private student information, or real financial data."
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the shortest repeatable sequence.
      placeholder: |
        1. Go to...
        2. Enter...
        3. Select...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch or commit
      description: Which branch or commit showed the problem?
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or additional context
      description: Remove secrets and private information before attaching evidence.
