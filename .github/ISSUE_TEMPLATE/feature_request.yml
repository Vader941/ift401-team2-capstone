name: Feature request
description: Propose a requirement-backed enhancement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What user or project need does this address?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe the behavior without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that determine when this is complete.
      placeholder: |
        - [ ] Given...
        - [ ] When...
        - [ ] Then...
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Requirement or Trello reference
      description: Link or identify the requirement, decision, or Trello card.
  - type: textarea
    id: risks
    attributes:
      label: Constraints or risks
      description: Note security, privacy, dependency, schedule, or data concerns.
