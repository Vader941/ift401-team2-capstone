{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mock Stock Trading System{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link href="{% static 'css/site.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                Mock Stock Trading
            </a>

            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <a class="btn btn-outline-primary" href="{% url 'market:stock-list' %}">
                        Stocks
                    </a>
                    <a class="btn btn-outline-primary" href="{% url 'trading:dashboard' %}">
                        Dashboard
                    </a>

                    {% if user.is_staff %}
                        <a class="btn btn-outline-secondary" href="{% url 'admin:index' %}">
                            Admin
                        </a>
                    {% endif %}

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-danger" type="submit">
                            Log Out
                        </button>
                    </form>
                {% else %}
                    <a class="btn btn-primary" href="{% url 'login' %}">
                        Log In
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
</body>
</html>
